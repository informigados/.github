<svg xmlns="http://www.w3.org/2000/svg" width="137" height="25" viewBox="0 0 137 25" role="img" aria-labelledby="title">
  <title id="title">Recent activity</title>
  <style>
    .background { fill: #effbf3; stroke: #a4d5b4; }
    .label, .arrow { fill: #244532; }
    .dot, .pulse { fill: #238636; }
    .pulse { opacity: 0; transform-box: fill-box; transform-origin: center; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #162a21; stroke: #355d48; }
      .label, .arrow { fill: #d0eada; }
      .dot, .pulse { fill: #62d085; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pulse 1.45s ease-out 2; }
    }
    @keyframes pulse {
      from { opacity: .40; transform: scale(1); }
      to { opacity: 0; transform: scale(2.6); }
    }
  </style>
  <rect class="background" x=".5" y=".5" width="136" height="24" rx="12"/>
  <circle class="pulse" cx="14" cy="12.5" r="3.5"/>
  <circle class="dot" cx="14" cy="12.5" r="3.5"/>
  <text class="label" x="26" y="16.5" font-family="system-ui, Segoe UI, sans-serif" font-size="11.5" font-weight="600">Recent activity</text>
  <path class="arrow" d="M115.5 12h6.1l-2.6-2.6.8-.8 4 4-4 4-.8-.8 2.6-2.6h-6.1z"/>
</svg>
